---
name: HA Matter Thread Utils
version: "0.1.0"
slug: ha_matter_thread_utils
description: >-
  Matter device commissioning (QR scan / manual code) and OTA firmware
  update utility for the python-matter-server add-on.
url: https://github.com/vinhlq/ha-matter-thread-utils
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 5173
panel_icon: mdi:chip
panel_title: Matter Utils
hassio_api: true        # needed for Supervisor API (discover matter-server IP)
hassio_role: manager   # needed to restart other add-ons (OTA firmware upload)
homeassistant_api: true # needed to fetch Thread credentials from HA Core after restart
map:
  # all_addon_configs mounts every add-on's config directory at /addon_configs/<slug>/
  # inside our container.  We write OTA descriptor JSON + binary to
  # /addon_configs/core_matter_server/updates/ which is the same host directory that
  # matter-server sees as /config/updates/ (its addon_config mount).
  - type: all_addon_configs
    read_only: false
options:
  # WebSocket URL of python-matter-server.
  matter_ws_url: "ws://127.0.0.1:5580/ws"
  # Supervisor add-on slug used to restart matter-server after a firmware upload.
  # Use "core_matter_server" for the official HA add-on.
  ota_addon_slug: "core_matter_server"
  # HTTPS port for direct browser access (camera requires a secure context).
  # HA ingress uses port 5173 (HTTP); open https://ha-ip:5174 directly for camera.
  https_port: 5174
schema:
  matter_ws_url: str?
  ota_addon_slug: str?
  https_port: int?
ports:
  5173/tcp: null
  5174/tcp: 5174
